<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <style>
        body { margin: 0; overflow: hidden; background-color: #1a1a1a; color: white; font-family: 'Segoe UI', sans-serif; }
        .ui-panel { position: absolute; top: 20px; left: 20px; background: rgba(30,30,30,0.9); padding: 15px; border-radius: 8px; width: 280px; border: 1px solid #444; z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
        /* 统一使用蓝色 #4db8ff */
        .ui-panel h2 { margin: 0 0 10px 0; font-size: 16px; color: #4db8ff; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .ui-panel p { font-size: 12px; color: #ccc; line-height: 1.5; }
        
        /* 颜色条 Colorbar */
        #colorbar-container {
            position: absolute; right: 30px; top: 50%; transform: translateY(-50%);
            display: flex; align-items: center; z-index: 10;
        }
        #colorbar {
            width: 20px; height: 300px; border: 1px solid #333; border-radius: 4px;
            /* 标准 Jet Colormap 渐变：红->黄->绿->青->蓝 */
            background: linear-gradient(to bottom, #800000, #ff0000, #ffff00, #00ff00, #00ffff, #0000ff, #000080);
        }
        .colorbar-labels { 
            display: flex; flex-direction: column; justify-content: space-between; 
            height: 300px; margin-left: 10px; font-size: 12px; font-weight: bold; color: #ccc;
        }
    </style>
    <script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
    <script>
        function applyLocalLang() {
            const lang = localStorage.getItem('lang') || 'cn';
            document.querySelectorAll('[data-cn]').forEach(el => {
                el.innerText = el.getAttribute('data-' + lang);
            });
        }
        document.addEventListener('DOMContentLoaded', applyLocalLang);
    </script>

    <div class="ui-panel">
        <h2 data-cn="🔥 脑表面激活热力图" data-en="🔥 Brain Surface Viz">🔥 脑表热力图</h2>
        <p>
            <b data-cn="状态:" data-en="Status:">状态:</b> 
            <span data-cn="高分辨率顶点着色模式" data-en="High-Res Vertex Coloring Mode">高分辨率顶点着色模式</span><br>
            <span data-cn="已成功将模拟的 fNIRS 激活映射到前额叶皮层。" data-en="Successfully mapped simulated fNIRS activation onto the prefrontal cortex.">已成功将模拟的 fNIRS 激活映射到前额叶皮层。</span>
        </p>
        <p style="color:#888; margin-top: 10px;" data-cn="* 旋转模型以观察热力图如何完美贴合脑回与脑沟。" data-en="* Rotate to observe how the heatmap perfectly follows the gyri and sulci.">* 旋转模型以观察热力图如何完美贴合脑回与脑沟。</p>
    </div>

    <div id="colorbar-container">
        <div id="colorbar"></div>
        <div class="colorbar-labels">
            <span> 0.0</span>
            <span>-0.5</span>
            <span>-1.0</span>
            <span>-1.5</span>
            <span>-2.0</span>
        </div>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        let scene, camera, renderer, controls, brainModel;

        init(); animate();

        function init() {
            scene = new THREE.Scene();
            camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
            camera.position.set(0, 50, 220);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(window.innerWidth, window.innerHeight);
            document.body.appendChild(renderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;

            scene.add(new THREE.AmbientLight(0xffffff, 0.4));
            const light1 = new THREE.DirectionalLight(0xffffff, 0.8);
            light1.position.set(50, 100, 150);
            scene.add(light1);
            const light2 = new THREE.DirectionalLight(0xffffff, 0.3);
            light2.position.set(-50, -50, 100);
            scene.add(light2);

            new GLTFLoader().load('brain.glb', gltf => {
                brainModel = gltf.scene;
                
                const box = new THREE.Box3().setFromObject(brainModel);
                const scale = 150 / Math.max(box.max.x-box.min.x, box.max.y-box.min.y, box.max.z-box.min.z);
                brainModel.scale.set(scale, scale, scale);
                const centerBox = new THREE.Box3().setFromObject(brainModel);
                brainModel.position.sub(centerBox.getCenter(new THREE.Vector3()));
                
                brainModel.updateMatrixWorld(true);

                brainModel.traverse(child => {
                    if (child.isMesh) {
                        applyVertexHeatmap(child);
                    }
                });
                
                scene.add(brainModel);
            });

            window.addEventListener('resize', () => {
                camera.aspect = window.innerWidth / window.innerHeight;
                camera.updateProjectionMatrix();
                renderer.setSize(window.innerWidth, window.innerHeight);
            });
        }

        function applyVertexHeatmap(mesh) {
            const geo = mesh.geometry;
            const posAttr = geo.attributes.position;
            const vertexCount = posAttr.count;
            
            const colors = new Float32Array(vertexCount * 3);
            const worldPos = new THREE.Vector3();

            // 模拟激活中心：增强 dlPFC 和 vmPFC
            const blobs = [
                { pos: new THREE.Vector3(-35, 30, 55), sigma: 12, weight: 0.1 },
                { pos: new THREE.Vector3(-15, 25, 65), sigma: 14, weight: 1.0 },
                { pos: new THREE.Vector3(15,  25, 65), sigma: 15, weight: 0.3 },
                { pos: new THREE.Vector3(38,  28, 55), sigma: 10, weight: 0.7 },
                { pos: new THREE.Vector3(-5,  10, 68), sigma: 8,  weight: 0.5 },
                { pos: new THREE.Vector3(25,  12, 65), sigma: 9,  weight: 0.6 }
            ];

            // 噪声函数：制造不均匀的数据纹理
            function simpleNoise3D(x, y, z) {
                const s = 0.5;
                return Math.sin(x * s) * Math.cos(y * s) * Math.sin(z * s) * 0.15;
            }

            // 平滑边界框设置
            const fuzzyBounds = {
                xHardMin: -50, xHardMax: 50, 
                yHardMin: -5,  yHardMax: 50, 
                zHardMin: 15,
                xInner_XMin: -46, xInner_XMax: 46, // 内收 4 个单位作为渐变区 (抗锯齿)
                yInner_YMin: 0,   yInner_YMax: 46,
                zInner_ZMin: 25 
            };

            // 健壮的衰减因子计算函数
            function getFadeFactor(val, hardMin, innerMin, innerMax, hardMax) {
                if (val <= hardMin || val >= hardMax) return 0;
                if (val >= innerMin && val <= innerMax) return 1;
                if (val < innerMin) return THREE.MathUtils.smoothstep(val, hardMin, innerMin);
                if (val > innerMax) return 1.0 - THREE.MathUtils.smoothstep(val, innerMax, hardMax);
                return 0; 
            }

            for (let i = 0; i < vertexCount; i++) {
                worldPos.fromBufferAttribute(posAttr, i);
                worldPos.applyMatrix4(mesh.matrixWorld);

                let r = 0.8, g = 0.8, b = 0.8; // 大脑灰底色

                // 如果完全在边界外，直接保持灰色
                if (worldPos.x <= fuzzyBounds.xHardMin || worldPos.x >= fuzzyBounds.xHardMax || 
                    worldPos.y <= fuzzyBounds.yHardMin || worldPos.y >= fuzzyBounds.yHardMax || 
                    worldPos.z <= fuzzyBounds.zHardMin) {
                    // 默认灰
                } else {
                    // 1. 计算该点的高斯激活叠加值
                    let rawActivation = 0;
                    blobs.forEach(blob => {
                        const dist = worldPos.distanceTo(blob.pos);
                        const val = Math.exp(-(dist * dist) / (2 * blob.sigma * blob.sigma));
                        rawActivation += val * blob.weight;
                    });

                    // 加入少量环境噪声
                    const noiseFactor = simpleNoise3D(worldPos.x, worldPos.y, worldPos.z);
                    
                    // 最终的数据强度：基础底噪 (0.1) + 激活值 + 杂乱噪声
                    let finalDataValue = 0.1 + rawActivation + noiseFactor;

                    // 将数据映射到色谱 0~1 的范围
                    const colormapVal = Math.max(0, Math.min(1, finalDataValue)); 
                    const jetColor = getJetColor(colormapVal);

                    // 2. 计算边缘抗锯齿因子 (0=灰色边界外，1=完全着色)
                    const xFactor = getFadeFactor(worldPos.x, fuzzyBounds.xHardMin, fuzzyBounds.xInner_XMin, fuzzyBounds.xInner_XMax, fuzzyBounds.xHardMax);
                    const yFactor = getFadeFactor(worldPos.y, fuzzyBounds.yHardMin, fuzzyBounds.yInner_YMin, fuzzyBounds.yInner_YMax, fuzzyBounds.yHardMax);
                    
                    let zFactor = 1.0;
                    if (worldPos.z < fuzzyBounds.zInner_ZMin) {
                        zFactor = THREE.MathUtils.smoothstep(worldPos.z, fuzzyBounds.zHardMin, fuzzyBounds.zInner_ZMin);
                    }

                    // 总混合因子：如果接近边缘，edgeFadeFactor 趋近于 0
                    const edgeFadeFactor = xFactor * yFactor * zFactor;

                    // 3. 颜色混合：在脑边界处，平滑地将彩色过渡为灰色，消除所有毛刺！
                    r = THREE.MathUtils.lerp(0.8, jetColor.r, edgeFadeFactor);
                    g = THREE.MathUtils.lerp(0.8, jetColor.g, edgeFadeFactor);
                    b = THREE.MathUtils.lerp(0.8, jetColor.b, edgeFadeFactor);
                }

                colors[i * 3] = r;
                colors[i * 3 + 1] = g;
                colors[i * 3 + 2] = b;
            }

            geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

            mesh.material = new THREE.MeshStandardMaterial({
                color: 0xffffff,      
                vertexColors: true,   
                roughness: 0.7,       
                metalness: 0.1,
                side: THREE.DoubleSide
            });
        }

        // 标准科学可视化渐变色 (Jet Colormap)
        function getJetColor(v) {
            let r = 0, g = 0, b = 0;
            if (v < 0.125) {
                r = 0; g = 0; b = 0.5 + 4 * v;
            } else if (v < 0.375) {
                r = 0; g = 4 * (v - 0.125); b = 1;
            } else if (v < 0.625) {
                r = 4 * (v - 0.375); g = 1; b = 1 - 4 * (v - 0.375);
            } else if (v < 0.875) {
                r = 1; g = 1 - 4 * (v - 0.625); b = 0;
            } else {
                r = 1 - 4 * (v - 0.875); g = 0; b = 0;
            }
            return { r, g, b };
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }
    </script>
</body>
</html>
