<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8" />
    <script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
    <style>
        /* ★ 核心修复：加入了 width: 100vw; height: 100vh; 撑开画布 */
        body { margin: 0; overflow: hidden; font-family: 'Segoe UI', sans-serif; background-color: #1a1a1a; color: white; width: 100vw; height: 100vh; }
        
        .ui-panel { position: absolute; top: 20px; left: 20px; background: rgba(30, 30, 30, 0.95); padding: 15px; border-radius: 8px; width: 280px; box-shadow: 0 4px 15px rgba(0,0,0,0.5); border: 1px solid #444; max-height: 85vh; overflow-y: auto; pointer-events: auto; }
        .ui-panel h2 { margin: 0 0 10px 0; font-size: 16px; color: #4db8ff; border-bottom: 1px solid #444; padding-bottom: 5px; }
        .ui-panel h3 { margin: 15px 0 5px 0; font-size: 13px; color: #aaa; border-bottom: 1px dashed #555; padding-bottom: 2px; text-transform: uppercase; letter-spacing: 1px; }
        .ui-panel label { display: block; margin-bottom: 4px; font-size: 12px; color: #ccc; margin-top: 5px; }
        .ui-panel button { width: 100%; padding: 8px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; margin-bottom: 5px; background: #444; color: #ddd; transition: 0.2s; font-size: 12px; }
        .ui-panel button:hover { background: #555; }
        .ui-panel input[type="file"], .ui-panel select { font-size: 11px; margin-bottom: 5px; color: #fff; width: 100%; background: #222; border: 1px solid #555; padding: 5px; border-radius: 4px; }
        .checkbox-row { display: flex; align-items: center; margin-bottom: 5px; cursor: pointer; }
        .checkbox-row input { margin-right: 8px; cursor: pointer; }
        .checkbox-row span { font-size: 12px; }
        .divider { border-top: 1px solid #444; margin: 15px 0; }
        
        .link { stroke: #444; stroke-width: 14px; stroke-linecap: round; transition: stroke 0.2s; }
        .link.hover-effect { stroke: #fff !important; cursor: pointer; }
        .ch-box { fill: #333; stroke: #555; stroke-width: 1.5px; rx: 3px; ry: 3px; transition: fill 0.3s; }
        .ch-text { font-size: 14px; font-weight: bold; fill: #eee; text-anchor: middle; dominant-baseline: middle; pointer-events: none; font-family: Arial, sans-serif; }
        .ch-text.dark { fill: #000 !important; }
        .node circle { stroke-width: 2px; }
        .node.source circle { fill: #ff4d4f; stroke: #a8071a; }
        .node.detector circle { fill: #1890ff; stroke: #0050b3; }
        .tooltip { position: absolute; background: rgba(0,0,0,0.9); border: 1px solid #444; color: white; padding: 5px 10px; border-radius: 4px; font-size: 12px; pointer-events: none; display: none; z-index: 1000; }
        .orientation-label { position: absolute; width: 100%; text-align: center; font-size: 14px; font-weight: bold; color: #666; letter-spacing: 2px; pointer-events: none; text-transform: uppercase; }
        .ori-top { top: 20px; }
        .ori-bottom { bottom: 20px; display: flex; justify-content: space-between; padding: 0 100px; box-sizing: border-box; }
        
        #sci-legend { position: absolute; bottom: 20px; left: 20px; background: rgba(30, 30, 30, 0.9); padding: 10px; border: 1px solid #444; border-radius: 6px; display: none; }
        .legend-item { display: flex; align-items: center; font-size: 11px; margin-bottom: 4px; color: #ddd; }
        .legend-color { width: 12px; height: 12px; margin-right: 8px; border-radius: 2px; }
    </style>
</head>
<body>
    <script>
        function applyLocalLang() {
            const lang = localStorage.getItem('lang') || 'cn';
            document.querySelectorAll('[data-cn]').forEach(el => {
                el.innerText = el.getAttribute('data-' + lang);
            });
        }
        document.addEventListener('DOMContentLoaded', applyLocalLang);
    </script>

    <div class="ui-panel">
        <h2 data-cn="🗺️ 2D 通道拓扑图" data-en="🗺️ Channel Map 2D">🗺️ 2D 通道拓扑图</h2>
        
        <h3 data-cn="基础地图" data-en="Base Map">基础地图</h3>
        <select id="map-selector" onchange="loadPreset(this.value)">
            <option value="preset/2d_channel/preset_49ch.json" data-cn="49 通道 (标准)" data-en="49 Channels (Standard)">49 通道 (标准)</option>
            <option value="preset/2d_channel/preset_45ch.json" data-cn="45 通道 (新增)" data-en="45 Channels (New)">45 通道 (新增)</option>
            <option value="custom" data-cn="加载自定义 JSON..." data-en="Load Custom JSON...">加载自定义 JSON...</option>
        </select>
        
        <div id="custom-upload-area" style="display:none; margin-top:5px; border:1px dashed #555; padding:5px;">
            <input type="file" id="config-upload" accept=".json" onchange="handleConfigUpload(this)">
        </div>
        
        <h3 data-cn="显示选项" data-en="Display Options">显示选项</h3>
        <label class="checkbox-row" title="Feature in development">
            <input type="checkbox" disabled> 
            <span style="color:#666" data-cn="脑区显示 (开发中)" data-en="Brain Region Display (Soon)">脑区显示 (开发中)</span>
        </label>
        
        <label data-cn="通道信号质量 (.csv)" data-en="Channel Quality (.csv)">通道信号质量 (.csv)</label>
        <input type="file" id="sci-upload" accept=".csv, .txt" onchange="window.handleSCIUpload(this)">
        <button onclick="window.clearSCI()" style="margin-top:5px; background:#555;" data-cn="清除质量数据" data-en="Clear Quality Data">清除质量数据</button>
        
        <div class="divider"></div>
        <button onclick="window.resetZoom()" data-cn="重置视图居中" data-en="Recenter View">重置视图居中</button>
    </div>

    <div class="orientation-label ori-top" data-cn="Posterior (后)" data-en="Posterior">Posterior (后)</div>
    <div class="orientation-label ori-bottom">
        <span data-cn="Right (右)" data-en="Right">Right (右)</span>
        <span data-cn="Anterior (前)" data-en="Anterior">Anterior (前)</span>
        <span data-cn="Left (左)" data-en="Left">Left (左)</span>
    </div>

    <div id="sci-legend">
        <div style="font-weight:bold; margin-bottom:5px; color:#fff;" data-cn="信号质量 (SCI)" data-en="Signal Quality (SCI)">信号质量 (SCI)</div>
        <div class="legend-item"><div class="legend-color" style="background:#00b050;"></div> <span data-cn="优秀 (≥ 0.6)" data-en="Excellent (≥ 0.6)">优秀 (≥ 0.6)</span></div>
        <div class="legend-item"><div class="legend-color" style="background:#ffc000;"></div> <span data-cn="中等 (0.3 - 0.6)" data-en="Medium (0.3 - 0.6)">中等 (0.3 - 0.6)</span></div>
        <div class="legend-item"><div class="legend-color" style="background:#ff0000;"></div> <span data-cn="较差 (< 0.3)" data-en="Poor (< 0.3)">较差 (< 0.3)</span></div>
    </div>

    <svg id="viz" width="100%" height="100%"></svg>
    <div id="tooltip" class="tooltip"></div>

    <script>
        const zoom = d3.zoom().scaleExtent([0.5, 3]).on("zoom", (e) => d3.select("#viz g").attr("transform", e.transform));
        const svg = d3.select("#viz");
        const g = svg.append("g");
        svg.call(zoom);

        function renderMap(data) {
            g.selectAll("*").remove(); d3.select("#tooltip").style("display", "none");
            if(!data) return; 
            const PX_PER_UNIT = 70; const NODE_R = 9;
            const nodes = []; const links = []; let autoChCount = 1;

            data.gridMap.forEach((rowStr, y) => {
                for (let x = 0; x < rowStr.length; x++) {
                    if (rowStr[x] === '1') {
                        const type = (x + y) % 2 === 0 ? 'source' : 'detector';
                        nodes.push({ id: `${x}_${y}`, x: x, y: y, type: type });
                        if (x + 1 < rowStr.length && rowStr[x+1] === '1') {
                            const key = `${x}_${y}_h`; const label = data.channelNumberMap[key] || String(autoChCount++);
                            links.push({ source: `${x}_${y}`, target: `${x+1}_${y}`, label: label });
                        }
                        if (y + 1 < data.gridMap.length) {
                            const nextRow = data.gridMap[y+1];
                            if (x < nextRow.length && nextRow[x] === '1') {
                                const key = `${x}_${y}_v`; const label = data.channelNumberMap[key] || String(autoChCount++);
                                links.push({ source: `${x}_${y}`, target: `${x}_${y+1}`, label: label });
                            }
                        }
                    }
                }
            });

            const width = window.innerWidth; const height = window.innerHeight;
            const mapWidth = data.gridMap[0].length * PX_PER_UNIT; const mapHeight = data.gridMap.length * PX_PER_UNIT;
            const offsetX = (width - mapWidth) / 2 + 100; const offsetY = (height + mapHeight) / 2 - 100; 
            const getPos = (x, y) => ({ cx: offsetX + x * PX_PER_UNIT, cy: offsetY - y * PX_PER_UNIT });

            const linkGroup = g.selectAll(".link-group").data(links).enter().append("g").attr("class", "link-group")
                .on("mouseover", function(e, d) { 
                    d3.select(this).select("line").classed("hover-effect", true); 
                    const lang = localStorage.getItem('lang') || 'cn';
                    const prefix = lang === 'cn' ? '通道: ' : 'Channel: ';
                    d3.select("#tooltip").style("display", "block").text(`${prefix}${d.label}`); 
                })
                .on("mouseout", function() { d3.select(this).select("line").classed("hover-effect", false); d3.select("#tooltip").style("display", "none"); })
                .on("mousemove", function(e) { d3.select("#tooltip").style("left", (e.pageX + 15) + "px").style("top", (e.pageY - 15) + "px"); });

            linkGroup.append("line").attr("class", "link").attr("id", d => `link-${d.label}`)
                .attr("x1", d => getPos(...d.source.split('_').map(Number)).cx).attr("y1", d => getPos(...d.source.split('_').map(Number)).cy)
                .attr("x2", d => getPos(...d.target.split('_').map(Number)).cx).attr("y2", d => getPos(...d.target.split('_').map(Number)).cy);

            const labelG = linkGroup.append("g");
            labelG.each(function(d) {
                const p1 = getPos(...d.source.split('_').map(Number)); const p2 = getPos(...d.target.split('_').map(Number));
                const midX = (p1.cx + p2.cx) / 2; const midY = (p1.cy + p2.cy) / 2;
                d3.select(this).append("rect").attr("class", "ch-box").attr("width", 26).attr("height", 18).attr("x", midX-13).attr("y", midY-9);
                d3.select(this).append("text").attr("class", "ch-text").attr("x", midX).attr("y", midY+1).text(d.label);
            });

            const nodeGroup = g.selectAll(".node").data(nodes).enter().append("g").attr("class", d => `node ${d.type}`)
                .attr("transform", d => { const p = getPos(d.x, d.y); return `translate(${p.cx}, ${p.cy})`; });
            nodeGroup.append("circle").attr("r", NODE_R);
        }

        window.handleSCIUpload = function(input) {
            const file = input.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) {
                const lines = e.target.result.split(/\r\n|\n/); const sciData = {}; 
                lines.forEach(line => {
                    line = line.trim(); if (!line) return;
                    const parts = line.split(','); let chStr = "", valStr = "";
                    if (parts[0] && parts[0].toUpperCase().indexOf("CH") > -1) { chStr = parts[0]; valStr = parts[1]; } 
                    else if (parts.length > 2 && parts[1] && parts[1].toUpperCase().indexOf("CH") > -1) { chStr = parts[1]; valStr = parts[2]; }
                    const chNum = parseInt(chStr.replace(/[^0-9]/g, "")); const val = parseFloat(valStr);
                    if (!isNaN(chNum) && !isNaN(val)) sciData[chNum.toString()] = val;
                });
                
                const lang = localStorage.getItem('lang') || 'cn';
                if (Object.keys(sciData).length === 0) {
                    alert(lang === 'cn' ? "解析失败！请检查 CSV 格式。" : "Parsing Failed. Check CSV format.");
                } else { 
                    applyChannelQuality(sciData); 
                    document.getElementById('sci-legend').style.display = 'block'; 
                }
            };
            reader.readAsText(file);
        }

        window.clearSCI = function() {
            document.getElementById('sci-upload').value = "";
            d3.selectAll('.link').style('stroke', '#444').style('stroke-opacity', 1);
            document.getElementById('sci-legend').style.display = 'none';
        }

        function applyChannelQuality(sciData) {
            d3.selectAll('.link').style('stroke', '#444').style('stroke-opacity', 1);
            d3.selectAll('.link').each(function(d) {
                const mapChKey = String(parseInt(d.label));
                if (sciData.hasOwnProperty(mapChKey)) {
                    const val = sciData[mapChKey]; let color = '#444';
                    if (val >= 0.6) color = '#00b050'; else if (val >= 0.3) color = '#ffc000'; else color = '#ff0000';
                    d3.select(this).style('stroke', color).style('stroke-opacity', 0.9);
                }
            });
        }

        async function loadPreset(val) {
            const uploadArea = document.getElementById('custom-upload-area');
            if (val === 'custom') { 
                uploadArea.style.display = 'block'; g.selectAll("*").remove(); 
            } else {
                uploadArea.style.display = 'none';
                try {
                    const res = await fetch(val);
                    if (!res.ok) throw new Error("Not found");
                    renderMap(await res.json());
                } catch(e) { 
                    console.error(e); 
                    const lang = localStorage.getItem('lang') || 'cn';
                    alert(lang === 'cn' ? `无法加载文件：${val}\n请确认本地 Server 已开启且文件存在。` : `Failed to load ${val}.\nEnsure server is running and file exists.`); 
                }
            }
        }

        window.handleConfigUpload = function(input) {
            const file = input.files[0]; if(!file) return;
            const reader = new FileReader();
            reader.onload = function(e) { 
                try { renderMap(JSON.parse(e.target.result)); } 
                catch(err) { 
                    const lang = localStorage.getItem('lang') || 'cn';
                    alert(lang === 'cn' ? "JSON 格式无效" : "Invalid JSON format"); 
                } 
            };
            reader.readAsText(file);
        }

        window.resetZoom = function() { svg.transition().duration(750).call(zoom.transform, d3.zoomIdentity); }
        
        // 获取下拉框当前的默认值进行加载
        const defaultMap = document.getElementById('map-selector').value;
        loadPreset(defaultMap);
    </script>
</body>
</html>
